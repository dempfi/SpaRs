[package]
name = "spars-node"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Node-API bindings for the native SpaRs NLP library"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
spars-model = { path = "../../crates/spars-model" }
spars = { package = "spars-nlp", path = "../../crates/spars" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
