name: native-fidelity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-and-rust:
    name: reference-and-rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: ${{ runner.os == 'Linux' && 'rustfmt,clippy' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            consumer -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Linux verification tools
        if: runner.os == 'Linux'
        run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix bindings/node ci --ignore-scripts --no-audit --no-fund
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv venv --python 3.12.5 .venv
      - run: uv pip sync --python .venv/bin/python tools/reference-requirements.lock
      - run: .venv/bin/python tools/acquire.py --all
      - run: .venv/bin/python tools/export.py --all
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path consumer/Cargo.toml
      - name: Require the recorded model-reference architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Run Linux acceptance
        if: runner.os == 'Linux'
        run: .venv/bin/python tools/verify.py --model-exports-only --report target/reports/verification-ci.json
      - name: Regenerate canonical model references
        if: runner.os == 'macOS'
        run: .venv/bin/python tools/check_models.py
      - name: Build and smoke test macOS native consumers
        if: runner.os == 'macOS'
        run: |
          npm --prefix bindings/node run build
          cargo build --release --locked --offline --manifest-path crates/spars-model/Cargo.toml
          cargo build --release --locked --offline --manifest-path consumer/Cargo.toml
          node_bin=$(command -v node)
          model_root=$(mktemp -d)
          for model in en_core_web_sm en_core_web_md en_core_web_lg; do
            model_path=$(env -i PATH= target/release/spars-model install --model "$model" --version 3.8.0 --archive "assets/$model-3.8.0-py3-none-any.whl" --root "$model_root")
            env -i PATH= target/release/spars-model verify "$model_path"
            env -i PATH= consumer/target/release/native-consumer-check "$model_path"
            env -i PATH= "$node_bin" bindings/node/scripts/smoke.mts "$model_path"
          done
      - name: Record performance separately from fidelity
        if: runner.os == 'Linux'
        run: .venv/bin/python tools/benchmark.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fidelity-reports-${{ matrix.os }}
          path: target/reports/
          retention-days: 14

  native-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            consumer -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm --prefix bindings/node ci --ignore-scripts --no-audit --no-fund
      - run: cargo fetch --locked
      - run: npm --prefix bindings/node run build
      - run: cargo build --locked --release --manifest-path crates/spars-model/Cargo.toml
      - run: cargo build --locked --release --manifest-path consumer/Cargo.toml
      - name: Download and install without interpreters
        run: |
          node_bin=$(command -v node)
          model_root=$(mktemp -d)
          for model in en_core_web_sm en_core_web_md en_core_web_lg; do
            model_path=$(env -i PATH= target/release/spars-model install --model "$model" --version 3.8.0 --root "$model_root")
            env -i PATH= target/release/spars-model verify "$model_path"
            env -i PATH= consumer/target/release/native-consumer-check "$model_path"
            env -i PATH= "$node_bin" bindings/node/scripts/smoke.mts "$model_path"
          done

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - run: node --test .github/scripts/*.test.cjs bindings/node/tests/release-assets.test.mts bindings/node/tests/release-publish.test.mts
