name: npm release
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag (vX.Y.Z)
        required: true
        type: string
      source:
        description: Optional exact source commit (40-character SHA) for a historical rebuild
        type: string
        default: ""
      publish:
        description: Publish verified tarballs to npm (requires trusted publishers)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
        with:
          script: |
            const release = await require('./.github/scripts/npm-release.cjs')({github, context, tag:process.env.RELEASE_TAG, source:process.env.RELEASE_SOURCE});
            core.setOutput('sha', release.sha);
            core.setOutput('version', release.version);

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - os: macos-14
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64-msvc
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-11-arm
            target: win32-arm64-msvc
          - os: ubuntu-24.04
            target: linux-x64-musl
            alpine: true
          - os: ubuntu-24.04-arm
            target: linux-arm64-musl
            alpine: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve identical source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ !matrix.alpine }}
      - run: npm --prefix bindings/node ci --ignore-scripts --no-audit --no-fund
        if: ${{ !matrix.alpine }}
      - run: cargo fetch --locked
        if: ${{ !matrix.alpine }}
      - run: cargo test --locked --release -p spars-model install::tests
        if: ${{ !matrix.alpine }}
      - run: npm --prefix bindings/node run build
        if: ${{ !matrix.alpine }}
      - run: npm --prefix bindings/node run typecheck
        if: ${{ !matrix.alpine }}
      - run: node --test bindings/node/tests/release*.test.mts
        if: ${{ !matrix.alpine }}
      - name: Collect native binary and notices
        if: ${{ !matrix.alpine }}
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node bindings/node/scripts/release.mts collect "$RELEASE_TARGET" "target/npm-input/$RELEASE_TARGET" "$RELEASE_SHA"
      - name: Build and collect inside native Alpine
        if: matrix.alpine
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          docker build -t spars-release-alpine - < bindings/node/scripts/release-alpine.Dockerfile
          docker run --rm -e RELEASE_SHA -e RELEASE_TARGET -v "$PWD:/work" -w /work spars-release-alpine sh bindings/node/scripts/release-alpine.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: target/npm-input/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: target/npm-input
      - name: Assemble complete release and pack without lifecycle scripts
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node bindings/node/scripts/release.mts stage target/npm-input target/npm-release "$RELEASE_SHA" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: target/npm-release/tarballs/
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: [validate, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - os: macos-14
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64-msvc
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-11-arm
            target: win32-arm64-msvc
          - os: ubuntu-24.04
            target: linux-x64-musl
            alpine: true
          - os: ubuntu-24.04-arm
            target: linux-arm64-musl
            alpine: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve identical source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ !matrix.alpine }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-tarballs
          path: target/npm-tarballs
      - run: npm --prefix bindings/node ci --ignore-scripts --no-audit --no-fund
        if: ${{ !matrix.alpine }}
      - run: cargo build --locked --release -p spars-model
        if: ${{ !matrix.alpine }}
      - name: Acquire model explicitly and test installed tarballs offline
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          model_dir=$(target/release/spars-model install --model en_core_web_sm --version 3.8.0 --root target/models)
          node bindings/node/scripts/release-smoke.mts target/npm-tarballs "$model_dir"

      - name: Test installed tarballs inside native Alpine
        if: matrix.alpine
        run: |
          docker build -t spars-release-alpine - < bindings/node/scripts/release-alpine.Dockerfile
          docker run --rm -v "$PWD:/work" -w /work spars-release-alpine sh bindings/node/scripts/release-alpine.sh smoke

  retain:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-tarballs
          path: tarballs
      - name: Record release checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          node bindings/node/scripts/release-assets.mts seal "$RELEASE_TAG" tarballs "$RELEASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-set
          overwrite: true
          path: tarballs/
          if-no-files-found: error
          retention-days: 14
      - name: Retain tested tarballs on the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node bindings/node/scripts/release-assets.mts upload "$RELEASE_TAG" tarballs

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [validate, retain]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-tarballs
          path: tarballs
      - name: Publish platform packages, then the main package
        run: node bindings/node/scripts/release-publish.mts tarballs
