[package]
name = "spars-model"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Explicit native model installation for SpaRs"

[[bin]]
name = "spars"
path = "src/short_main.rs"

[[bin]]
name = "spars-model"
path = "src/main.rs"

[dependencies]
spars = { package = "spars-nlp", path = "../spars" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
fs2 = "0.4"
libc = "0.2"
safetensors = "0.8"
rmpv = { version = "1.3", features = ["with-serde"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
