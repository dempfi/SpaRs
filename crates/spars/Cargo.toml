[package]
name = "spars-nlp"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Experimental native Rust inference for official spaCy models"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tareksanger/SpaRs"
homepage = "https://github.com/tareksanger/SpaRs"
keywords = ["nlp", "spacy", "tokenization", "parsing"]
categories = ["text-processing", "science"]
include = [
    "/src/**",
    "!/src/**/tests.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/licenses/spacy-MIT.txt",
    "/licenses/thinc-MIT.txt",
    "/licenses/preshed-MIT.txt",
    "/licenses/flashtext-MIT.txt",
    "/licenses/Unicode.txt",
]

[lib]
name = "spars"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
fancy-regex = "0.19"
sha2 = "0.11.0"
safetensors = "0.8.0"
matrixmultiply = { version = "=0.3.11", default-features = false, features = ["std"] }
